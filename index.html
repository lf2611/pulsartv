<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulsar</title>
<style>
html{font-size:20.8px}
:root{--accent:#1f6bff;--bg:#05070d;--bg-image:radial-gradient(55rem 32rem at 90% -12%,rgba(31,107,255,.2),transparent 60%);
 --text:#e9eefb;--muted:#7d8aa2;--card:rgba(255,255,255,.04);--hover:rgba(255,255,255,.09);--field:rgba(255,255,255,.08);--modal:#0c1220;--focus:#ffd45a;--ok:#3ddc84;--bad:#ff5a5f;--wait:#9aa4b8;--c-ctry:#4da3ff;--c-lang:#ff9f43;--c-cat:#e040fb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg-image),var(--bg);background-attachment:fixed;color:var(--text);font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:.15rem solid var(--focus);outline-offset:.15rem}
svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden,[hidden]{display:none!important}
.btn{padding:.7rem 1.3rem;border-radius:.7rem;background:var(--field);font-weight:600}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff}
.btn.small{padding:.4rem .8rem;font-size:.85rem;font-weight:500}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- INICIO ---------- */
#home{position:absolute;inset:0;overflow:auto;padding:1.8rem clamp(1.2rem,5vw,4.5rem) 4rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:2.6rem}
.home-top .acts{display:flex;gap:.3rem}
.sect{margin:2.2rem 0 .8rem;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.55rem}
.card{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:1rem 1.1rem;border-radius:.8rem;background:var(--card);text-align:left;color:var(--text);transition:background .15s}
.card:hover,.card:focus-visible{outline:none;background:var(--hover);box-shadow:inset 0 0 0 1px var(--accent)}
.c-t{font-size:1.1rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-n{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums;flex:none}
.hero{margin:18vh auto 0;max-width:30rem;text-align:center}
.hero p{color:var(--muted);margin:0 0 1.4rem}

/* ---------- REPRODUCTOR ---------- */
#player{position:absolute;inset:0;background:#000;overflow:hidden;color:#fff}
#player.idle{cursor:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8d97aa;padding:1.5rem;pointer-events:none}
#empty strong{display:block;font-size:1.6rem;font-weight:500;color:#fff;margin-bottom:.4rem}
.fade{transition:opacity .4s ease}
#player:not(.ui-on) .fade{opacity:0;pointer-events:none}
.ib{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;opacity:.85;flex:none;transition:background .15s,opacity .15s}
.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.16);opacity:1}
#topbar{position:absolute;top:0;left:0;right:0;height:4.4rem;padding:.8rem 1rem;display:flex;align-items:center;gap:.3rem;z-index:6;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#topbar .sp{flex:1}
#hud{position:absolute;left:0;right:0;bottom:0;padding:.8rem 1.6rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;background:rgba(3,6,14,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.08);z-index:7;transition:opacity .4s}
#nowBox{display:flex;align-items:stretch;gap:1rem;min-width:0}
.nbar{width:.3rem;border-radius:.2rem;background:var(--wait);flex:none;transition:background .2s}
#nowBox.ok .nbar{background:var(--ok)}#nowBox.bad .nbar{background:var(--bad)}
#nowName{font-size:1.7rem;font-weight:600;text-shadow:0 .1rem .5rem #000a}
#nowMeta{color:#c3cbd9;font-size:.95rem;margin-top:.1rem;text-shadow:0 .1rem .3rem #000a;max-width:50vw}
.controls{display:flex;align-items:center;gap:.2rem}
.vol{display:flex;align-items:center;gap:.2rem}
.vol input{width:6rem;accent-color:#fff}

#drawer{position:absolute;top:4.4rem;left:0;bottom:0;width:min(27rem,92vw);z-index:5;display:flex;flex-direction:column;color:#fff;text-shadow:0 .08rem .4rem rgba(0,0,0,.95);background:linear-gradient(90deg,rgba(3,6,14,.55) 0%,rgba(3,6,14,.38) 70%,rgba(3,6,14,0) 100%);transform:translateX(-102%);transition:transform .3s ease,opacity .4s ease}
#drawer.open{transform:none}
.d-head{padding:.4rem 1.2rem .2rem;display:flex;align-items:baseline;justify-content:space-between;gap:.8rem}
.d-head h2{margin:0;font-size:1.3rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-head span{color:#b7c1d3;font-size:.9rem;white-space:nowrap}
.d-filters{padding:.3rem 1rem;display:flex;gap:.4rem;flex-wrap:wrap}
.d-filters select{max-width:8.5rem;padding:.4rem .5rem;border:0;border-radius:.5rem;background:rgba(255,255,255,.12);font-size:.88rem;color:#fff;text-shadow:none}
.d-filters select option{color:#111;background:#fff}
.chip{padding:.4rem .75rem;border-radius:.5rem;background:rgba(255,255,255,.12);font-size:.88rem;color:#fff}
.chip.on{background:#fff;color:#000;text-shadow:none}
#search{margin:.3rem 1rem .5rem;padding:.6rem .8rem;border:0;border-radius:.6rem;background:rgba(255,255,255,.12);color:#fff;width:calc(100% - 2rem);font-size:.95rem;text-shadow:none}
#search::placeholder{color:#b3bdd0}
#channelList{flex:1;overflow:auto;padding:0 .6rem 6.5rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.row{display:flex;align-items:center;border-radius:.9rem;margin:.15rem 0}
.row:hover{background:rgba(255,255,255,.09)}
.row:focus-within{background:rgba(255,255,255,.14)}
.row.sel{background:rgba(10,58,118,.85);box-shadow:inset 0 0 0 .1rem #2f8bff}
.pick{flex:1;min-width:0;padding:.8rem .8rem .8rem .6rem;text-align:left;color:#fff;text-shadow:inherit}
.pick:focus-visible{outline:none}
.pick .nm{display:block;font-weight:500;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{padding:.4rem .6rem;border-radius:.5rem;color:#c3cbd9;font-size:.8rem;flex:none;text-shadow:inherit}
.mini:hover{color:#fff;background:rgba(255,255,255,.14)}
.dot{width:.85rem;height:.85rem;border-radius:50%;flex:none;margin-left:.9rem;background:transparent}
.row .fav{opacity:.8;font-size:1.6rem;line-height:1;padding:.3rem .7rem;margin-right:.3rem;color:#d5dbe8}
.row:hover .fav,.row:focus-within .fav,.row .fav.on{opacity:1}
.row .fav.on{color:#ffd34e}
.more{display:block;width:100%;padding:.8rem;color:#c3cbd9;text-align:center;font-size:.9rem}
.more:hover{color:#fff}
.none{padding:1.2rem;color:#dfe6f3}

/* ---------- MODALES ---------- */
.mwrap{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:1rem;z-index:20}
.mwrap.open{display:flex}
.modal{width:min(36rem,96vw);max-height:92vh;overflow:auto;background:var(--modal);color:var(--text);border-radius:1rem;padding:1.5rem;box-shadow:0 1.2rem 4rem #000a,0 0 0 1px rgba(255,255,255,.08);scrollbar-width:thin}
.modal.wide{width:min(46rem,96vw)}
.modal h2{margin:0 0 .6rem;font-size:1.3rem;font-weight:600}
.modal h3{margin:1.5rem 0 .6rem;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.2em;font-weight:600}
.field{display:flex;flex-direction:column;gap:.4rem;margin:.8rem 0}
.field label{color:var(--muted);font-size:.9rem}
.field input[type=text],.field input[type=url],.field input:not([type]){padding:.7rem;border:0;border-radius:.6rem;background:var(--field);color:var(--text);width:100%}
.field input[type=range]{accent-color:#fff;width:100%}
.macts{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.1rem;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted);line-height:1.45;margin:.3rem 0}
.lrow{display:flex;align-items:center;gap:.5rem;padding:.4rem 0}
.lrow .ln{flex:1;min-width:0}.lrow .ln b{display:block;font-weight:600}.lrow .ln small{color:var(--muted)}
.chk{display:flex;align-items:center;gap:.6rem;color:var(--text)!important;font-size:1rem!important}
.tags{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{padding:.4rem .8rem;border-radius:2rem;background:var(--field);font-size:.9rem;color:var(--muted);transition:background .15s,color .15s}
.tag:hover,.tag:focus-visible{color:var(--text);background:var(--hover)}
.tag.sel{background:#fff;color:#05070d}
.tag.done{background:rgba(94,234,212,.16);color:#5eead4}
.tag.done::before{content:"✓ "}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.mhead h2{margin:0}
.mhead .ib{width:2.6rem;height:2.6rem}
@keyframes pulse{50%{opacity:.45}}
.home-top h1{display:flex;align-items:center;gap:.9rem;margin:0;font-weight:700}
.scale-row{display:flex;align-items:center;gap:.8rem}.scale-row input{flex:1}.scale-row .btn{min-width:3.4rem;font-size:1.2rem}
.card:focus-visible,.btn:focus-visible,.ib:focus-visible,.tag:focus-visible{outline:.18rem solid var(--focus);outline-offset:.12rem}
.home-top .logo{margin:0;line-height:0;flex:1;min-width:0}
.home-top .logo img{display:block;width:clamp(13rem,24vw,19rem);max-width:100%;height:auto;mix-blend-mode:screen;margin:-1rem 0 -1rem -1.2rem}
.home-top .mark{width:2.3rem;height:2.3rem;color:var(--accent);filter:drop-shadow(0 0 .6rem rgba(31,107,255,.7));stroke-width:1.5}
.home-top .mark .r{animation:beat 3.2s ease-in-out infinite;transform-origin:12px 12px}
.home-top .mark .r2{animation-delay:.5s}
@keyframes beat{0%,100%{opacity:.15}50%{opacity:.7}}
.home-top .wm{font-size:clamp(2rem,4.4vw,3rem);letter-spacing:.38em;text-transform:uppercase;font-weight:700;background:linear-gradient(90deg,#fff 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,2rem);opacity:0;pointer-events:none;background:#fff;color:#05070d;padding:.7rem 1.2rem;border-radius:2rem;z-index:40;font-weight:500;transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.macts.left{justify-content:flex-start}

#home{padding-bottom:7rem}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:1rem}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.5rem}
.flag{display:grid;place-items:center;aspect-ratio:3/2;border-radius:.4rem;overflow:hidden;background:var(--field);font-weight:700;color:var(--muted);flex:none}
.flag img{width:100%;height:100%;object-fit:cover;display:block}
.flag svg{width:55%;height:55%}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:1.1rem .8rem;border-radius:1rem;background:var(--card);color:var(--text);transition:background .15s,transform .15s}
.tile .flag{width:7rem}
.tile .nm{font-size:1.25rem;font-weight:600;text-align:center}
.tile:hover,.tile:focus-visible{background:var(--hover);transform:scale(1.04);outline:.18rem solid var(--focus);outline-offset:.1rem}
.tile.sel{background:rgba(31,107,255,.22);box-shadow:inset 0 0 0 .18rem var(--accent)}
.tile.sel::after{content:"✓";position:absolute;top:.5rem;right:.6rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:700}
.tile.sm{flex-direction:row;padding:.7rem .9rem;gap:.8rem}
.tile.sm .flag{width:2.8rem}.tile.sm .nm{font-size:1.05rem;font-weight:500;text-align:left}
.tile.sm.sel::after{top:50%;right:.7rem;transform:translateY(-50%)}
#pickbar{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);display:flex;align-items:center;gap:1rem;padding:.5rem .5rem .5rem 1.2rem;border-radius:3rem;background:#0c1220f2;box-shadow:0 .6rem 2rem #000a,0 0 0 1px rgba(255,255,255,.1);z-index:10}
#pickbar .flag{width:2.2rem}.flags{display:flex;gap:.4rem}
#goBtn{display:flex;align-items:center;gap:.5rem;padding:.8rem 1.8rem;border-radius:2rem;background:var(--accent);color:#fff;font-size:1.3rem;font-weight:700}
#goBtn svg{width:1.6rem;height:1.6rem}
#goBtn:focus-visible{outline:.18rem solid var(--focus);outline-offset:.15rem}
#langQ{display:block;width:100%;margin:2rem 0 1rem;padding:1.1rem 1.4rem;border:0;border-radius:1rem;background:var(--field);color:var(--text);font-size:1.6rem}
#langQ::placeholder{color:var(--muted)}
#prog{position:fixed;top:0;left:0;height:.25rem;width:0;background:var(--accent);transition:width .3s;z-index:30}
.ring{width:5rem;height:5rem;border-radius:50%;border:.5rem solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .9s linear infinite;margin:auto}
.ring.sm{width:2.2rem;height:2.2rem;border-width:.28rem}
@keyframes spin{to{transform:rotate(360deg)}}
#spin{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;transition:padding-left .3s}
#spin .ring{width:7rem;height:7rem;border-width:.7rem;filter:drop-shadow(0 .2rem .8rem #000)}
#player.drawer-open #spin{padding-left:min(27rem,92vw)}
.d-langs{display:flex;flex-wrap:wrap;gap:.4rem;padding:.4rem 1rem .2rem}
.lchip{display:flex;align-items:center;gap:.45rem;padding:.25rem .8rem .25rem .3rem;border-radius:2rem;background:rgba(255,255,255,.2);color:#fff;font-size:.95rem;text-shadow:inherit}
.lchip .flag{width:1.9rem;font-size:.6rem}.lchip:hover,.lchip:focus-visible{background:rgba(255,255,255,.32)}
.lchip.plus{padding:.3rem}.lchip.plus svg{width:1.4rem;height:1.4rem}
.seg{padding:.4rem .7rem;border-radius:.5rem;background:rgba(255,255,255,.12);color:#fff;font-size:.85rem;text-shadow:inherit}
.seg.on{background:#fff;color:#000;text-shadow:none}
.chip svg{width:1.05rem;height:1.05rem;display:inline-block;vertical-align:-.2rem}
.chip:focus-visible,.seg:focus-visible,.lchip:focus-visible{outline:.15rem solid var(--focus)}
#cats{display:none;flex:1;flex-wrap:wrap;align-content:flex-start;gap:.4rem;padding:.4rem 1rem 6.5rem;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
#drawer.cats-open #cats{display:flex}
#drawer.cats-open #channelList{display:none}
.lchip .x{display:grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;margin-left:.1rem;background:rgba(255,255,255,.18)}
.lchip .x:hover,.lchip .x:focus-visible{background:#fff;color:#000;text-shadow:none}
.lchip .x svg{width:.95rem;height:.95rem;stroke-width:2.5}
.lchip.lg{padding:.25rem .35rem .25rem .8rem;cursor:default}
.d-top{display:flex;align-items:center;gap:.6rem;padding:.4rem 1rem .3rem}
.pill{display:inline-flex;align-items:center;gap:.6rem;min-width:0;padding:.6rem .9rem;border-radius:1rem;background:rgba(14,18,34,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;font-size:1.05rem;text-shadow:none;transition:background .15s,box-shadow .15s}
.pill:hover{background:rgba(30,36,64,.92)}
.pill svg{width:1.6rem;height:1.6rem;flex:none}
.d-top .pill{position:relative;padding:.65rem .8rem}
.pill svg{color:var(--kc)}
#ctryBtn{--kc:var(--c-ctry)}#langBtn{--kc:var(--c-lang)}#catBtn{--kc:var(--c-cat)}
.pill.on-c{box-shadow:inset 0 0 0 .1rem var(--kc)}
.pill .bd,.kind .bd{min-width:1.35rem;height:1.35rem;padding:0 .35rem;border-radius:1rem;background:var(--kc);color:#05070d;font-size:.8rem;font-weight:700;display:inline-grid;place-items:center;text-shadow:none}
.pill .bd{position:absolute;top:-.4rem;right:-.4rem}
.d-flt{display:flex;align-items:center;gap:.5rem;padding:.3rem 1rem .6rem}
.eye{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem .85rem .45rem .65rem;border-radius:2rem;font-size:1.05rem;font-variant-numeric:tabular-nums;color:#7d8aa2;background:rgba(14,18,34,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);text-shadow:none;transition:background .15s,color .15s,box-shadow .15s}
.eye svg{width:1.5rem;height:1.5rem}
.eye:hover{background:rgba(30,36,64,.8)}
.eye .ey{display:grid;opacity:.8}
.eye.ok .ey{color:var(--ok)}.eye.bad .ey{color:var(--bad)}.eye.unk .ey{color:#c4cbdb}
.eye.on .ey{opacity:1}
.eye.ok.on{color:var(--ok);background:rgba(61,220,132,.14);box-shadow:inset 0 0 0 1px var(--ok)}
.eye.bad.on{color:var(--bad);background:rgba(255,90,95,.14);box-shadow:inset 0 0 0 1px var(--bad)}
.eye.unk.on{color:#d3d9e6;background:rgba(190,198,214,.16);box-shadow:inset 0 0 0 1px #aab3c6}
.vsep{width:1px;align-self:stretch;margin:.2rem .3rem;background:rgba(255,255,255,.25)}
.sq{width:2.8rem;height:2.8rem;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:1.5rem;line-height:1;flex:none;text-shadow:none}
.sq:hover{background:rgba(255,255,255,.16)}
#chkBtn.run{width:auto;border-radius:2rem;padding:0 .8rem;display:inline-flex;align-items:center;gap:.3rem;font-size:.9rem;background:#fff;color:#000}
#chkBtn.run svg{width:1.2rem;height:1.2rem}
#favChip{color:#8b95a9}
#favChip.on{color:#ffd34e;background:rgba(255,211,78,.22)}
.d-srch{position:relative;margin:.3rem 1rem .5rem}
.d-srch #search{margin:0;width:100%;padding-right:3.8rem}
.d-srch #dCount{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);color:#dfe6f3;font-size:.85rem;font-variant-numeric:tabular-nums;text-shadow:none;pointer-events:none}
.chip.big{font-size:.92rem;display:inline-flex;align-items:center;gap:.35rem}
.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.u{background:#dfe5f1}
@media(max-width:650px){.grid.sm{grid-template-columns:repeat(auto-fill,minmax(10rem,1fr))}.tile .flag{width:5rem}#player.drawer-open #hud,#player.drawer-open #spin{padding-left:1.6rem}.vol input{display:none}#nowMeta{max-width:40vw}}

.home-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 1.2rem}
.home-head h2{margin:0;font-size:1.5rem;font-weight:600}
.chooser h2{margin:0 0 1.2rem;font-size:1.6rem;font-weight:600;text-align:center}
.chooser .grid{grid-template-columns:repeat(2,minmax(10rem,16rem));justify-content:center;gap:1.4rem}
.chooser .tile{padding:2rem 1rem}
.chooser .tile .flag{width:6rem;font-size:2.2rem}
.chooser .hint{text-align:center;margin-top:1.2rem}

#drawer .d-langs{display:none}
#drawer.langs-open .d-langs{display:flex}
.kinds{display:flex;flex-wrap:wrap;gap:.8rem;margin:0 0 1.5rem}
.kind{display:inline-flex;align-items:center;gap:.7rem;padding:.8rem 1.3rem;border-radius:1rem;background:var(--card);color:var(--text);font-size:1.15rem;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:background .15s}
.kind svg{width:1.8rem;height:1.8rem;color:var(--kc)}
.kind:hover{background:var(--hover)}
.kind.k-country{--kc:var(--c-ctry);--kb:rgba(77,163,255,.18)}
.kind.k-lang{--kc:var(--c-lang);--kb:rgba(255,159,67,.18)}
.kind.k-cat{--kc:var(--c-cat);--kb:rgba(224,64,251,.18)}
.kind.on{background:var(--kb);box-shadow:inset 0 0 0 .15rem var(--kc)}
.hrow{display:flex;gap:1rem;overflow-x:auto;padding:.5rem .3rem 1.1rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.hrow .tile{flex:none;width:9.5rem}
.tile.more-t.on{box-shadow:inset 0 0 0 .18rem var(--focus)}
.flag.cat{background:transparent;color:var(--c-cat)}
#pickbar .flag.cat{display:flex;align-items:center;gap:.25rem;width:auto;padding:0 .5rem;aspect-ratio:auto;font-size:1.1rem;color:var(--c-cat)}
#pickbar .flag.cat svg{width:1.5rem;height:1.5rem}

function parseM3U(text){
 const out=[];let info=null;
 for(const raw of text.replace(/^\uFEFF/,'').split(/\r?\n/)){
  const line=raw.trim();if(!line)continue;
  if(line.startsWith('#EXTINF')){
   const k=line.lastIndexOf(','),a=line.slice(0,k<0?line.length:k);
   const g=n=>{const m=a.match(new RegExp('(?:^|\\s)'+n+'="([^"]*)"','i'));return m?m[1].trim():''};
   const cats=g('group-title').split(';').map(s=>trCat(s.trim())).filter(Boolean);
   info={name:(k>=0?line.slice(k+1).trim():'')||g('tvg-name')||'Canal',cats:cats.length?cats:['Otros'],country:g('tvg-country')};
  }else if(!line.startsWith('#')&&/^https?:\/\//i.test(line)){
   out.push({...(info||{name:'Canal',cats:['Otros'],country:''}),url:line});info=null;
  }
 }
 return out;
}
async function fetchText(url){

}

const jobs={};
function loadLang(code){
 return jobs[code]||(jobs[code]=(async()=>{
  const items=parseM3U(await fetchText(BASE+'languages/'+code+'.m3u'));
  items.forEach(p=>{
   seen.add(p.url);let c=chMap.get(p.url);
   if(!c){c={url:p.url,lgs:[]};chMap.set(p.url,c)}
   c.name=p.name;c.cats=p.cats;c.country=p.country;if(!c.lgs.includes(code))c.lgs.push(code);
  });
  cnt[code]=items.length;saveData();onData();
 })().catch(e=>{delete jobs[code];if(/HTTP 404/.test(e.message)){cnt[code]=0;return}failed++;throw e}));
}
const jobsC={};
function loadCountry(code){

   if(!c){c={url:p.url,lgs:[],cts:[]};chMap.set(p.url,c)}
   c.name=p.name;c.cats=p.cats;c.country=p.country;if(!c.cts)c.cts=[];if(!c.cts.includes(code))c.cts.push(code);
  });
  ccnt[code]=items.length;saveData();onData();
 })().catch(e=>{delete jobsC[code];if(/HTTP 404/.test(e.message)){ccnt[code]=0;return}failed++;throw e}));

 total=order.length;prog();

async function probe(u){
 const go=async(opt)=>{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),8000);try{return await fetch(u,{...opt,signal:ac.signal,cache:'no-store'})}finally{clearTimeout(t)}};
 try{
  const r=await go({});
  if(!r.ok)return'0';
  if(/\.m3u8?(\?|#|$)/i.test(u)||/mpegurl/i.test(r.headers.get('content-type')||''))return(await r.text()).includes('#EXTM3U')?'1':'0';
  try{r.body&&r.body.cancel()}catch{}return'1';
 }catch(e){
  if(e&&e.name==='AbortError')return'0';
  try{await go({mode:'no-cors'});return'1'}catch{return'0'}
 }
}

 let triedNative=false,started=false,lastErr='';
 const live=()=>tok===playTok;
 const err=m=>{if(!live())return;clearTimeout(playTO);spin(false);setSt(u,'0');setNow('bad');$('nowMeta').textContent=m;$('empty').hidden=false;$('emptyT').textContent='No se pudo reproducir';$('emptyS').textContent=m;wake()};
 const nativeFallback=()=>{if(triedNative)return;triedNative=true;if(hls){hls.destroy();hls=null}video.src=u;video.load();video.play().catch(()=>err('El navegador rechazó la reproducción.'))};
 video.onplaying=()=>{if(!live())return;started=true;clearTimeout(playTO);spin(false);setSt(u,'1');setNow('ok');$('empty').hidden=true;$('nowMeta').textContent=c.cats.join(' · ')};
 video.onwaiting=()=>{if(live())spin(true)};
 video.onerror=()=>{if(live()&&!started)err('No compatible.'+(lastErr?' HLS: '+lastErr+'.':'')+' Puede estar caído o bloqueado por región.')};
 playTO=setTimeout(()=>{if(!started)err('El canal no responde.')},30000);
 const isHls=/\.m3u8(?:$|[?#])/i.test(u);
 if(window.Hls&&Hls.isSupported()&&(isHls||!/\.(mp4|webm|ogg|mp3)(?:$|[?#])/i.test(u))){
  hls=new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:20});
  hls.on(Hls.Events.MEDIA_ATTACHED,()=>hls.loadSource(u));
  hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{spin(false);$('nowMeta').textContent='Tocá Play.'}));
  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){lastErr=[d.type,d.details].filter(Boolean).join(' / ');if(!triedNative)nativeFallback();else err('Error HLS: '+lastErr)}});
  hls.attachMedia(video);
 }else nativeFallback();
 wake();
}
function changeChannel(dir){
 const v=visible();if(!v.length)return;let p=v.findIndex(c=>c.url===selId);if(p<0)p=dir>0?-1:0;
 playChannel(v[(p+dir+v.length)%v.length].url);
}
$('prevBtn').onclick=()=>changeChannel(-1);$('nextBtn').onclick=()=>changeChannel(1);
const togglePlay=()=>{if(!video.currentSrc&&!video.getAttribute('src'))return;video.paused?video.play().catch(()=>{}):video.pause()};
$('playBtn').onclick=togglePlay;
const syncPlay=()=>{$('playBtn').innerHTML=video.paused?ic.play:ic.pause};
const syncVol=()=>{$('muteBtn').innerHTML=(video.muted||video.volume===0)?ic.mute:ic.vol;$('vol').value=video.muted?0:video.volume};
video.addEventListener('play',()=>{syncPlay();wake()});video.addEventListener('pause',()=>{syncPlay();wake()});video.addEventListener('volumechange',syncVol);
$('muteBtn').onclick=()=>{video.muted=!video.muted;if(!video.muted&&video.volume===0)video.volume=.5};
$('vol').oninput=e=>{video.muted=false;video.volume=+e.target.value;store.set('miiptv2-vol',video.volume)};
video.volume=store.get('miiptv2-vol',1);syncPlay();syncVol();
let uiWasOn=false;
player.addEventListener('pointerdown',()=>{uiWasOn=player.classList.contains('ui-on')},{capture:true,passive:true});
video.addEventListener('click',()=>{if(uiWasOn)hideUI()});
video.addEventListener('dblclick',()=>toggleFs());
const fsActive=()=>document.fullscreenElement||document.webkitFullscreenElement;
const exitFs=()=>(document.exitFullscreen||document.webkitExitFullscreen).call(document);
async function toggleFs(){try{if(fsActive())await exitFs();else await(player.requestFullscreen||player.webkitRequestFullscreen).call(player)}catch{$('nowMeta').textContent='Pantalla completa no disponible'}}
$('fsBtn').onclick=toggleFs;

/* ---------- interfaz que se oculta sola ---------- */
let idleT;
const settingsOpen=()=>$('settingsModal').classList.contains('open');
const modalOpen=settingsOpen;
function locked(){return !selId||video.paused||modalOpen()||document.activeElement===$('search')||player.querySelector('#topbar button:hover,.controls :hover,#drawer:hover')}
function wake(){if(player.hidden)return;player.classList.add('ui-on');player.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(tick,4000)}
function tick(){if(locked()){idleT=setTimeout(tick,1500);return}player.classList.remove('ui-on');player.classList.add('idle')}
function hideUI(){setDrawer(false);clearTimeout(idleT);player.classList.remove('ui-on');player.classList.add('idle');const a=document.activeElement;if(a&&a!==document.body&&player.contains(a))a.blur()}

/* ---------- botón Atrás ---------- */
function onBack(){
 if(settingsOpen()){closeSettings();return true}
 if(!player.hidden){if(selId&&player.classList.contains('ui-on'))hideUI();else goHome();return true}
 return false;
}
window.pulsarBack=onBack;
let armT;history.replaceState({p:0},'');history.pushState({p:1},'');
addEventListener('popstate',()=>{
 if(onBack()){history.pushState({p:1},'');return}
 toast('Atrás otra vez para salir');clearTimeout(armT);armT=setTimeout(()=>history.pushState({p:1},''),2500);
});
['mousemove','mousedown','touchstart','wheel'].forEach(ev=>player.addEventListener(ev,wake,{passive:true}));
document.addEventListener('fullscreenchange',wake);

/* ---------- ajustes ---------- */
const closeSettings=()=>$('settingsModal').classList.remove('open');
$('settingsBtn').onclick=$('settingsHome').onclick=()=>{$('status').textContent='';$('settingsModal').classList.add('open')};
$('closeSettings').onclick=closeSettings;
$('refreshAll').onclick=()=>{closeSettings();toast('Actualizando listas…');loadAll()};
$('wipeAll').onclick=()=>{if(!confirm('¿Borrar los canales guardados y volver a descargarlos?'))return;chMap.clear();cnt={};ccnt={};st={};channels=[];DB.set('chdata',null);DB.set('status',{});closeSettings();if(!player.hidden)renderDrawer();loadAll()};
document.querySelectorAll('.mwrap').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)m.classList.remove('open')}));
$('chBtn').onclick=()=>setDrawer(!drawerOpen());
$('homeBtn').onclick=goHome;

/* ---------- teclado ---------- */
document.addEventListener('keydown',e=>{
 const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
 if(e.key==='Escape'||e.key==='GoBack'||e.key==='BrowserBack'||[4,461,10009].includes(e.keyCode)||(e.key==='Backspace'&&!typing)){
  if(onBack())e.preventDefault();return;
 }
 if(!typing&&(e.key==='+'||e.key==='-')){e.preventDefault();stepScale(e.key==='+'?.1:-.1);return}
 if(typing||modalOpen()||player.hidden)return;
 wake();
 const a=document.activeElement,inSide=a.closest&&a.closest('#drawer');
 if(inSide&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&a.closest('#channelList')){e.preventDefault();const p=[...document.querySelectorAll('#channelList .pick')];const i=p.indexOf(a.closest('.row')&&a.closest('.row').querySelector('.pick'));const n=p[i+(e.key==='ArrowDown'?1:-1)];if(n)n.focus();return}
 if(inSide&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key))return;
 switch(e.key){
  case'f':case'F':e.preventDefault();toggleFs();break;
  case'm':case'M':video.muted=!video.muted;break;
  case'c':case'C':case'ContextMenu':case'MediaTrackNext':setDrawer(!drawerOpen());break;
  case'Enter':if(a===document.body||a===video){e.preventDefault();setDrawer(!drawerOpen())}break;
  case'MediaPlayPause':e.preventDefault();togglePlay();break;
  case'h':case'H':goHome();break;
  case'ArrowRight':e.preventDefault();changeChannel(1);break;
  case'ArrowLeft':e.preventDefault();changeChannel(-1);break;
  case'ArrowUp':e.preventDefault();video.muted=false;video.volume=Math.min(1,video.volume+.05);break;
  case'ArrowDown':e.preventDefault();video.volume=Math.max(0,video.volume-.05);break;
  case' ':if(a===document.body||a===video){e.preventDefault();togglePlay()}break;
 }
});

/* ---------- arranque ---------- */
(async()=>{
 const d=await DB.get('chdata');
 if(d&&Array.isArray(d.channels)){d.channels.forEach(c=>{if(c&&c.url&&Array.isArray(c.lgs)&&Array.isArray(c.cats))chMap.set(c.url,c)});cnt=d.cnt||{};ccnt=d.ccnt||{}}
 st=(await DB.get('status'))||{};
 onData(true);renderHome();
 await getLangs();if(mode==='country')await getCountries();renderHome();
 loadAll();
})();
})();
</script>
</body>
</html>
