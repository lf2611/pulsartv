<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulsar TV</title>
<meta name="theme-color" content="#05070d">
<meta name="application-name" content="Pulsar TV">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
html{font-size:16px}
:root{--accent:#1f6bff;--bg:#05070d;--bg-image:radial-gradient(55rem 32rem at 90% -12%,rgba(31,107,255,.2),transparent 60%);
 --text:#e9eefb;--muted:#7d8aa2;--card:rgba(255,255,255,.04);--hover:rgba(255,255,255,.09);--field:rgba(255,255,255,.08);--modal:#0c1220;--focus:#ffd45a;--dw:min(29.7rem,92vw)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg-image),var(--bg);background-attachment:fixed;color:var(--text);font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:.15rem solid var(--focus);outline-offset:.15rem}
svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden,[hidden]{display:none!important}
.btn{padding:.7rem 1.3rem;border-radius:.7rem;background:var(--field);font-weight:600}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff}
.btn.small{padding:.4rem .8rem;font-size:.85rem;font-weight:500}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- INICIO ---------- */
#home{position:absolute;inset:0;overflow:auto;padding:1.8rem clamp(1.2rem,5vw,4.5rem) 4rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:2.6rem}
.home-top .acts{display:flex;gap:.3rem}
.sect{margin:2.2rem 0 .8rem;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.55rem}
.card{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:1rem 1.1rem;border-radius:.8rem;background:var(--card);text-align:left;color:var(--text);transition:background .15s}
.card:hover,.card:focus-visible{outline:none;background:var(--hover);box-shadow:inset 0 0 0 1px var(--accent)}
.c-t{font-size:1.1rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-n{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums;flex:none}
.hero{margin:18vh auto 0;max-width:30rem;text-align:center}
.hero p{color:var(--muted);margin:0 0 1.4rem}

/* ---------- REPRODUCTOR ---------- */
#player{position:absolute;inset:0;background:#000;overflow:hidden;color:#fff}
#player.idle{cursor:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8d97aa;padding:1.5rem;pointer-events:none}
#empty strong{display:block;font-size:1.6rem;font-weight:500;color:#fff;margin-bottom:.4rem}
.fade{transition:opacity .4s ease}
#player:not(.ui-on) .fade{opacity:0;pointer-events:none}
.ib{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;opacity:.85;flex:none;transition:background .15s,opacity .15s}
.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.16);opacity:1}
#topbar{position:absolute;top:0;left:0;right:0;height:6.6rem;padding:.8rem 1rem;display:flex;align-items:center;gap:.3rem;z-index:6;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#topbar .sp{flex:1}
#hud{position:absolute;left:0;right:0;bottom:0;padding:.8rem 1.6rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;background:rgba(3,6,14,.08);-webkit-backdrop-filter:none;backdrop-filter:none;border-top:1px solid rgba(255,255,255,.035);z-index:7;transition:opacity .4s}
#nowName{font-size:1.7rem;font-weight:600;text-shadow:0 .1rem .5rem #000a}
#nowMeta{color:#c3cbd9;font-size:.95rem;margin-top:.1rem;text-shadow:0 .1rem .3rem #000a;max-width:50vw}
.controls{display:flex;align-items:center;gap:.2rem}
.vol{display:flex;align-items:center;gap:.2rem}
.vol input{width:6rem;accent-color:#fff}

#drawer{position:absolute;top:0;left:0;bottom:0;width:var(--dw);z-index:8;display:flex;flex-direction:column;color:#fff;text-shadow:0 .08rem .4rem rgba(0,0,0,.95);background:linear-gradient(90deg,rgba(3,6,14,.72) 0%,rgba(3,6,14,.60) 70%,rgba(3,6,14,.12) 100%);transform:translateX(-102%);transition:transform .3s ease,opacity .4s ease}
#drawer.open{transform:none}
#search{margin:.3rem 1rem .5rem;padding:.6rem .8rem;border:0;border-radius:.6rem;background:rgba(255,255,255,.12);color:#fff;width:calc(100% - 2rem);font-size:.95rem;text-shadow:none}
#search::placeholder{color:#b3bdd0}
#channelList{flex:1;overflow:auto;padding:0 .6rem 6.5rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.row{display:flex;align-items:center;border-radius:.6rem;margin:.05rem 0}
.row:hover{background:rgba(255,255,255,.09)}
.row:focus-within{background:rgba(255,255,255,.14)}
.row.sel{background:rgba(255,255,255,.18);box-shadow:inset .2rem 0 0 #fff}
.pick{flex:1;min-width:0;padding:.8rem .8rem .8rem .6rem;text-align:left;color:#fff;text-shadow:inherit}
.pick:focus-visible{outline:none}
.pick .nm{display:block;font-weight:500;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{padding:.4rem .6rem;border-radius:.5rem;color:#c3cbd9;font-size:.8rem;flex:none;text-shadow:inherit}
.mini:hover{color:#fff;background:rgba(255,255,255,.14)}
.dot{width:.5rem;height:.5rem;border-radius:50%;flex:none;margin-left:.8rem;background:transparent}
.row .edit,.row .fav{opacity:0}
.row:hover .edit,.row:focus-within .edit,.row:hover .fav,.row:focus-within .fav,.row .fav.on{opacity:1}
.row .fav{font-size:1rem}.row .fav.on{color:#ffd34e}
.more{display:block;width:100%;padding:.8rem;color:#c3cbd9;text-align:center;font-size:.9rem}
.more:hover{color:#fff}
.none{padding:1.2rem;color:#dfe6f3}

/* ---------- MODALES ---------- */
.mwrap{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:1rem;z-index:20}
.mwrap.open{display:flex}
.modal{width:min(36rem,96vw);max-height:92vh;overflow:auto;background:var(--modal);color:var(--text);border-radius:1rem;padding:1.5rem;box-shadow:0 1.2rem 4rem #000a,0 0 0 1px rgba(255,255,255,.08);scrollbar-width:thin}
.modal.wide{width:min(46rem,96vw)}
.modal h2{margin:0 0 .6rem;font-size:1.3rem;font-weight:600}
.modal h3{margin:1.5rem 0 .6rem;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.2em;font-weight:600}
.field{display:flex;flex-direction:column;gap:.4rem;margin:.8rem 0}
.field label{color:var(--muted);font-size:.9rem}
.field input[type=text],.field input[type=url],.field input:not([type]){padding:.7rem;border:0;border-radius:.6rem;background:var(--field);color:var(--text);width:100%}
.field input[type=range]{accent-color:#fff;width:100%}
.macts{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.1rem;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted);line-height:1.45;margin:.3rem 0}
.lrow{display:flex;align-items:center;gap:.5rem;padding:.4rem 0}
.lrow .ln{flex:1;min-width:0}.lrow .ln b{display:block;font-weight:600}.lrow .ln small{color:var(--muted)}
.chk{display:flex;align-items:center;gap:.6rem;color:var(--text)!important;font-size:1rem!important}
.tags{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{padding:.4rem .8rem;border-radius:2rem;background:var(--field);font-size:.9rem;color:var(--muted);transition:background .15s,color .15s}
.tag:hover,.tag:focus-visible{color:var(--text);background:var(--hover)}
.tag.sel{background:#fff;color:#05070d}
.tag.done{background:rgba(94,234,212,.16);color:#5eead4}
.tag.done::before{content:"✓ "}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.mhead h2{margin:0}
.mhead .ib{width:2.6rem;height:2.6rem}
@keyframes pulse{50%{opacity:.45}}
.home-top h1{display:flex;align-items:center;gap:.9rem;margin:0;font-weight:700}
.scale-row{display:flex;align-items:center;gap:.8rem}.scale-row input{flex:1}.scale-row .btn{min-width:3.4rem;font-size:1.2rem}
.card:focus-visible,.btn:focus-visible,.ib:focus-visible,.tag:focus-visible{outline:.18rem solid var(--focus);outline-offset:.12rem}
.home-top .logo{margin:0;line-height:0;flex:1;min-width:0}
.home-top .logo img{display:block;width:clamp(13rem,24vw,19rem);max-width:100%;height:auto;mix-blend-mode:screen;margin:-1rem 0 -1rem -1.2rem}
.home-top .mark{width:2.3rem;height:2.3rem;color:var(--accent);filter:drop-shadow(0 0 .6rem rgba(31,107,255,.7));stroke-width:1.5}
.home-top .mark .r{animation:beat 3.2s ease-in-out infinite;transform-origin:12px 12px}
.home-top .mark .r2{animation-delay:.5s}
@keyframes beat{0%,100%{opacity:.15}50%{opacity:.7}}
.home-top .wm{font-size:clamp(2rem,4.4vw,3rem);letter-spacing:.38em;text-transform:uppercase;font-weight:700;background:linear-gradient(90deg,#fff 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,2rem);opacity:0;pointer-events:none;background:#fff;color:#05070d;padding:.7rem 1.2rem;border-radius:2rem;z-index:40;font-weight:500;transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.macts.left{justify-content:flex-start}

#home{padding-bottom:7rem}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:1rem}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.5rem}
.flag{display:grid;place-items:center;aspect-ratio:3/2;border-radius:.4rem;overflow:hidden;background:var(--field);font-weight:700;color:var(--muted);flex:none}
.flag img{width:100%;height:100%;object-fit:cover;display:block}
.flag svg{width:55%;height:55%}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:1.1rem .8rem;border-radius:1rem;background:var(--card);color:var(--text);transition:background .15s,transform .15s}
.tile .flag{width:7rem}
.tile .nm{font-size:1.25rem;font-weight:600;text-align:center}
.tile:hover,.tile:focus-visible{background:var(--hover);transform:scale(1.04);outline:.18rem solid var(--focus);outline-offset:.1rem}
.tile.sel{background:rgba(31,107,255,.22);box-shadow:inset 0 0 0 .18rem var(--accent)}
.tile.sel::after{content:"✓";position:absolute;top:.5rem;right:.6rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:700}
.tile.sm{flex-direction:row;padding:.7rem .9rem;gap:.8rem}
.tile.sm .flag{width:2.8rem}.tile.sm .nm{font-size:1.05rem;font-weight:500;text-align:left}
.tile.sm.sel::after{top:50%;right:.7rem;transform:translateY(-50%)}
#pickbar{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);display:flex;align-items:center;gap:1rem;padding:.5rem .5rem .5rem 1.2rem;border-radius:3rem;background:#0c1220f2;box-shadow:0 .6rem 2rem #000a,0 0 0 1px rgba(255,255,255,.1);z-index:10}
#pickbar .flag{width:2.2rem}.flags{display:flex;gap:.4rem}
#goBtn{display:flex;align-items:center;gap:.5rem;padding:.8rem 1.8rem;border-radius:2rem;background:var(--accent);color:#fff;font-size:1.3rem;font-weight:700}
#goBtn svg{width:1.6rem;height:1.6rem}
#goBtn:focus-visible{outline:.18rem solid var(--focus);outline-offset:.15rem}
#langQ{display:block;width:100%;margin:2rem 0 1rem;padding:1.1rem 1.4rem;border:0;border-radius:1rem;background:var(--field);color:var(--text);font-size:1.6rem}
#langQ::placeholder{color:var(--muted)}
#prog{position:fixed;top:0;left:0;height:.25rem;width:0;background:var(--accent);transition:width .3s;z-index:30}
.ring{width:5rem;height:5rem;border-radius:50%;border:.5rem solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .9s linear infinite;margin:auto}
.ring.sm{width:2.2rem;height:2.2rem;border-width:.28rem}
@keyframes spin{to{transform:rotate(360deg)}}
#spin{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
#spin .ring{width:7rem;height:7rem;border-width:.7rem;filter:drop-shadow(0 .2rem .8rem #000)}
.lchip{display:flex;align-items:center;gap:.45rem;padding:.25rem .8rem .25rem .3rem;border-radius:2rem;background:rgba(255,255,255,.2);color:#fff;font-size:.95rem;text-shadow:inherit}
.lchip .flag{width:1.9rem;font-size:.6rem}.lchip:hover,.lchip:focus-visible{background:rgba(255,255,255,.32)}
.lchip.plus{padding:.3rem}.lchip.plus svg{width:1.4rem;height:1.4rem}
.lchip .x{display:grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;margin-left:.1rem;background:rgba(255,255,255,.18)}
.lchip .x:hover,.lchip .x:focus-visible{background:#fff;color:#000;text-shadow:none}
.lchip .x svg{width:.95rem;height:.95rem;stroke-width:2.5}
.lchip.lg{padding:.25rem .35rem .25rem .8rem;cursor:default}
.dot.g{background:#3ddc84}.dot.r{background:#ff5a5f}.dot.u{box-shadow:inset 0 0 0 .1rem rgba(255,255,255,.35)}
@media(max-width:650px){.grid.sm{grid-template-columns:repeat(auto-fill,minmax(10rem,1fr))}.tile .flag{width:5rem}#player.drawer-open #hud{padding-left:1.6rem}.vol input{display:none}#nowMeta{max-width:40vw}}

.home-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 1.2rem}
.home-head h2{margin:0;font-size:1.5rem;font-weight:600}
.chooser h2{margin:0 0 1.2rem;font-size:1.6rem;font-weight:600;text-align:center}
.chooser .grid{grid-template-columns:repeat(2,minmax(10rem,16rem));justify-content:center;gap:1.4rem}
.chooser .tile{padding:2rem 1rem}
.chooser .tile .flag{width:6rem;font-size:2.2rem}
.chooser .hint{text-align:center;margin-top:1.2rem}


/* ---------- menú lateral: filtros plegables, luces y borde ---------- */
.d-secs{flex:none;display:flex;flex-wrap:wrap;gap:.2rem 1.3rem;padding:.55rem 1.2rem .15rem}
.sec{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem 0;font-size:1.05rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8f9ab0;text-shadow:inherit;transition:color .15s}
.sec:hover,.sec.open{color:#fff}
.sec .ct{display:none;min-width:1.4rem;padding:0 .4rem;border-radius:1rem;background:rgba(255,255,255,.22);color:#fff;font-size:.78rem;letter-spacing:0;line-height:1.4rem;text-align:center;text-transform:none;text-shadow:none}
.sec.has .ct{display:inline-block}
.p-none{color:#9aa5ba;font-size:.9rem}
#pQ::placeholder{color:#b3bdd0}
.p-list{max-height:min(16rem,32vh);overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.opt{display:flex;align-items:center;gap:.6rem;width:100%;padding:.5rem .6rem;border-radius:.45rem;color:#dfe6f3;text-align:left;font-size:.95rem}
.opt>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt:hover,.opt:focus-visible{background:rgba(255,255,255,.1)}
.opt small{color:#8d97aa;font-variant-numeric:tabular-nums}
.opt.on{color:#fff;background:rgba(255,255,255,.16)}
.opt.on::after{content:"✓";font-weight:700}
.d-bar{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;padding:.5rem 1.2rem .1rem}
.lt.g{--c:#3ddc84;--d:#1c4a33}
.lt.r{--c:#ff5a5f;--d:#552a2d}
.lt.u{--c:#c3cad8;--d:#3a4150}
.d-r{display:flex;align-items:center;gap:.15rem;padding-top:.1rem}
.d-r .ib{width:2.5rem;height:2.5rem}
#refTxt{font-size:.8rem;color:#dfe6f3;font-variant-numeric:tabular-nums;margin-right:.2rem}
#refBtn.busy svg{animation:spin 1s linear infinite}
#favBtn.on{color:#ffd34e;opacity:1}
#favBtn.on svg{fill:currentColor}
#edge{position:absolute;left:0;top:0;bottom:0;width:3.2rem;z-index:9}
#player.drawer-open #edge{pointer-events:none}
@media(hover:none){#edge{pointer-events:none}}
#edgeTab{position:absolute;top:50%;left:0;transform:translateY(-50%);width:3.2rem;height:8.4rem;z-index:11;display:grid;place-items:center;border-radius:0 1.6rem 1.6rem 0;background:rgba(3,6,14,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;transition:left .3s ease,opacity .4s ease,background .15s}
#edgeTab:hover,#edgeTab:focus-visible{background:rgba(3,6,14,.85)}
#edgeTab svg{width:2.3rem;height:2.3rem;stroke-width:3.6;transition:transform .3s}
#player.drawer-open #edgeTab{left:var(--dw)}
#player.drawer-open #edgeTab svg{transform:rotate(180deg)}

.lights{display:flex;gap:.9rem;align-items:center}
.lt{display:flex;align-items:center;gap:.35rem;padding:.25rem .3rem;border-radius:.5rem;text-shadow:inherit}
.lt .led{width:1.15rem;height:1.15rem;flex:none;stroke:none}
.lt .ln{fill:var(--d);transition:fill .15s}
.lt.on .ln{fill:var(--c)}
.lt .hl{fill:#fff;opacity:.1}
.lt.on .hl{opacity:.3}
.lt .n{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;color:#7d8aa2}
.lt.on .n{color:#fff}

#logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:5.6rem;width:auto;max-width:60vw;object-fit:contain;pointer-events:none;user-select:none}
#empty img{display:block;margin:0 auto;height:min(32vh,16.8rem);width:auto;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){#empty img{animation:none}}
#drawer.panel-open #search,#drawer.panel-open #channelList{display:none}

.d-panel{flex:none;margin:.2rem .8rem;padding:.2rem 0;text-shadow:none}
.p-top{display:flex;flex-direction:column;align-items:stretch;gap:.5rem;margin-bottom:.7rem}
.p-sel:empty{display:none}
.p-sel{flex:none;min-width:0;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.p-sel .lchip{background:#fff;color:#05070d;text-shadow:none;font-weight:600}
.p-sel .lchip .x{background:rgba(0,0,0,.12);color:#05070d}
.p-sel .lchip .x:hover,.p-sel .lchip .x:focus-visible{background:#05070d;color:#fff}
#pOk{flex:none;background:#c42bf5;color:#fff;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.75rem;padding:.32rem .9rem}
#pOk:hover{background:#d65cff}
.p-btns{order:-1;flex:none;display:flex;justify-content:flex-end;gap:.4rem;align-items:center}
#pClr{flex:none;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.75rem;padding:.32rem .9rem}
.p-sel .lchip{font-size:.85rem;padding:.18rem .3rem .18rem .65rem}.p-sel .lchip .x{width:1.3rem;height:1.3rem}.p-sel .lchip .x svg{width:.8rem;height:.8rem}
.p-search{position:relative;margin-bottom:.5rem}
.p-search svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1.15rem;height:1.15rem;color:#b3bdd0;pointer-events:none}
#pQ{display:block;width:100%;padding:.6rem .8rem .6rem 2.4rem;border:0;border-radius:.6rem;background:rgba(255,255,255,.12);color:#fff;font-size:.95rem}
#drawer.panel-open .d-panel{flex:1;display:flex;flex-direction:column;min-height:0;margin-bottom:8rem}
#drawer.panel-open .p-pick{flex:1;display:flex;flex-direction:column;min-height:0}
#drawer.panel-open .p-list{flex:1;max-height:none}
#channelList{padding-bottom:8rem}
.controls{gap:.9rem}
.vol{gap:.5rem}
.vol input{width:8.4rem}
.controls .ib{width:4.5rem;height:4.5rem}
.controls .ib svg{width:2.1rem;height:2.1rem}
@media(max-width:650px){.controls{gap:.2rem}.controls .ib{width:3.2rem;height:3.2rem}.controls .ib svg{width:1.5rem;height:1.5rem}}

/* Controles inferiores: iconos blancos y legibles sobre video sin oscurecerlo */
#hud .controls .ib{color:#fff!important;opacity:1!important;text-shadow:0 1px 4px rgba(0,0,0,.9)}

 #drawer{background:linear-gradient(90deg,rgba(3,6,14,.97) 0%,rgba(3,6,14,.95) 42%,rgba(3,6,14,.88) 70%,rgba(3,6,14,.65) 85%,rgba(3,6,14,0) 100%)!important;}
}

/* Indicador central de pausa: visible solo si hay un video pausado. */
#pausedOverlay{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
#pausedOverlay[hidden]{display:none!important}
#pausedOverlay button{pointer-events:auto;display:grid;place-items:center;width:5.4rem;height:5.4rem;border-radius:50%;background:rgba(65,69,78,.78);color:#fff;box-shadow:0 .3rem 1.5rem rgba(0,0,0,.35);transition:background .15s,transform .15s}
#pausedOverlay button:hover,#pausedOverlay button:focus-visible{background:rgba(88,92,104,.95);transform:scale(1.06)}
#pausedOverlay button svg{width:2.5rem;height:2.5rem}
</style>

 const visible=e=>{if(!e||!e.isConnected)return false;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>0&&r.height>0&&c.visibility!=='hidden'&&c.display!=='none'&&!e.closest('[hidden]')};
 const scope=()=>{
  const m=[...document.querySelectorAll('.mwrap.open')].filter(visible).pop();
  return m||document;
 };
 const candidates=()=>[...scope().querySelectorAll(selector)].filter(e=>visible(e)&&!e.closest('[aria-hidden="true"]'));
 const center=e=>{const r=e.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,l:r.left,r:r.right,t:r.top,b:r.bottom}};

  const all=candidates(),a=document.activeElement;
  if(!all.length)return;
  if(!all.includes(a)){(all.find(e=>e.closest('#drawer'))||all[0]).focus({preventScroll:true});return}
  const o=center(a),vertical=key==='ArrowUp'||key==='ArrowDown',sign=(key==='ArrowRight'||key==='ArrowDown')?1:-1;
  let best=null,score=Infinity;
  for(const e of all){if(e===a)continue;const p=center(e),primary=(vertical?p.y-o.y:p.x-o.x)*sign;
   if(primary<2)continue;
   const secondary=Math.abs(vertical?p.x-o.x:p.y-o.y);
   const overlap=vertical?Math.max(0,Math.min(o.r,p.r)-Math.max(o.l,p.l)):Math.max(0,Math.min(o.b,p.b)-Math.max(o.t,p.t));
   const cost=primary+secondary*(overlap>0?.24:2.1);
   if(cost<score){score=cost;best=e}
  }
  if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'})}
 };
 document.addEventListener('focusin',e=>{document.querySelectorAll('.tv-focused').forEach(x=>x.classList.remove('tv-focused'));if(e.target.matches('button'))e.target.classList.add('tv-focused')});
 document.addEventListener('keydown',e=>{
  const k=e.key==='Select'?'Enter':e.key;
  if(keys.includes(k)){
   const a=document.activeElement;
   if(a&&a.matches('input[type="range"]')&&(k==='ArrowLeft'||k==='ArrowRight'))return;
   if(a&&a.matches('input:not([type="range"]),textarea')&&(k==='ArrowLeft'||k==='ArrowRight'))return;
   e.preventDefault();e.stopImmediatePropagation();navigate(k);return;
  }

 },true);

  const active=document.activeElement;
  if(!visible(active)||active===document.body){const all=candidates();if(all.length)all[0].focus({preventScroll:true})}

 obs.observe(document.body,{attributes:true,attributeFilter:['class','hidden'],subtree:true});

})();

 playTO=setTimeout(()=>{if(!started)err('El canal no responde.')},30000);
 const isHls=/\.m3u8(?:$|[?#])/i.test(u);
 if(window.Hls&&Hls.isSupported()&&(isHls||!/\.(mp4|webm|ogg|mp3)(?:$|[?#])/i.test(u))){
  hls=new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:20});

  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){lastErr=[d.type,d.details].filter(Boolean).join(' / ');if(!triedNative)nativeFallback();else err('Error HLS: '+lastErr)}});

}

 customLists.forEach(x=>{

  name.textContent=x.name;name.title=x.source==='file'?'Archivo local: '+(x.filename||x.name):x.url;update.textContent='Actualizar';remove.textContent='Eliminar';
  update.onclick=()=>importCustomList(x,true);remove.onclick=()=>{

   customLists=customLists.filter(y=>y.id!==x.id);flt.custom.delete(x.id);if(x.source==='file')DB.set('m3u-file-'+x.id,null);
   for(const [u,c] of chMap){c.customIds=(c.customIds||[]).filter(id=>id!==x.id);if(!c.customIds.length&&!(c.lgs||[]).length&&!(c.cts||[]).length)chMap.delete(u)}
   store.set('pulsar-custom-lists',customLists);saveView();saveData();onData(true);renderCustomManage();renderDrawer();

async function importCustomList(item,refresh=false){
 const btn=$('importCustom'),status=$('customStatus');btn.disabled=true;status.textContent='Descargando lista…';
 try{
  const txt=item.source==='file'?await DB.get('m3u-file-'+item.id):await fetchText(item.url),items=parseM3U(txt||'');
  if(!items.length)throw Error('No se encontraron canales válidos en la lista M3U.');
  const urls=new Set(items.map(x=>x.url));
  for(const[u,c]of chMap){if((c.customIds||[]).includes(item.id)&&!urls.has(u)){c.customIds=c.customIds.filter(id=>id!==item.id);if(!c.customIds.length&&!(c.lgs||[]).length&&!(c.cts||[]).length)chMap.delete(u)}}
  items.forEach(x=>{let c=chMap.get(x.url);if(!c){c={url:x.url,name:x.name,cats:x.cats,country:x.country,lgs:[],cts:[],customIds:[]};chMap.set(x.url,c)}if(!c.customIds)c.customIds=[];if(!c.customIds.includes(item.id))c.customIds.push(item.id)});
  if(!refresh){customLists.push(item);flt.custom.add(item.id)}
  store.set('pulsar-custom-lists',customLists);saveView();saveData();onData(true);renderCustomManage();renderDrawer();
  status.textContent=items.length+' canales '+(refresh?'actualizados':'importados')+' en «'+item.name+'».';
  if(!refresh){$('customName').value='';$('customUrl').value=''}
 }catch(e){status.textContent='No se pudo importar: '+e.message+(item.source==='file'?'':' La URL debe permitir descargas desde el navegador (CORS).')}
 finally{btn.disabled=false}
}

  if(onBack())e.preventDefault();return;

 }

// En retrato, las cuatro pestañas pasan al encabezado y siguen siendo operativas.
(function(){

 if(!tabs||!drawer||!top||!menu)return;
 const anchor=document.createComment('Ubicación original de pestañas');tabs.parentNode.insertBefore(anchor,tabs);
 const portrait=()=>window.matchMedia('(max-width:650px) and (orientation:portrait)').matches;
 function sync(){
  if(portrait()){if(tabs.parentNode!==top)top.appendChild(tabs)}
  else if(tabs.parentNode!==drawer)anchor.parentNode.insertBefore(tabs,anchor.nextSibling);
  menu.setAttribute('aria-expanded',drawer.classList.contains('open')?'true':'false');
  menu.innerHTML=drawer.classList.contains('open')?'<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>':'<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
  menu.setAttribute('aria-label',drawer.classList.contains('open')?'Cerrar canales y filtros':'Abrir canales y filtros');
 }
 menu.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const open=!drawer.classList.contains('open');drawer.classList.toggle('open',open);document.getElementById('player')?.classList.toggle('drawer-open',open);sync()});

})();

<script>
/* Pulsar TV: todos los idiomas en un único archivo locales/idiomas.json */
(()=>{
 const LOCALES='./locales/idiomas.json';let dictionary={},active='es';
 const original=new WeakMap();const attributes=new WeakMap();
 const allowed=['title','aria-label','placeholder','alt'];
 const norm=s=>s.trim();
 function translate(s){
   if(!s||!s.trim())return s;
   const key=norm(s);const translated=dictionary[key];
   if(typeof translated==='string')return s.replace(key,translated);
   // Traduce segmentos etiquetados en mensajes compuestos, sin alterar números ni nombres propios.
   let result=s;
   for(const [k,v] of Object.entries(dictionary)){
     if(k.length<4||k===v||!result.includes(k))continue;
     result=result.split(k).join(v);
   }
   return result;
 }
 function applyNode(node){
   if(node.nodeType===3){
     if(!node.parentElement||node.parentElement.closest('script,style,textarea,option[data-no-i18n]'))return;
     const now=node.nodeValue;
     const prev=original.get(node);
     const source=prev&&prev.translated===now?prev.source:now;
     const translated=translate(source);
     original.set(node,{source,translated});
     if(now!==translated)node.nodeValue=translated;
   }else if(node.nodeType===1){
     if(node.matches('script,style'))return;
     let saved=attributes.get(node)||{};
     for(const attr of allowed){
       if(!node.hasAttribute(attr))continue;
       const now=node.getAttribute(attr);const prev=saved[attr];
       const source=prev&&prev.translated===now?prev.source:now;
       const translated=translate(source);saved[attr]={source,translated};
       if(now!==translated)node.setAttribute(attr,translated);
     }
     attributes.set(node,saved);
     for(const child of node.childNodes)applyNode(child);
   }
 }
 let busy=false;
 const observer=new MutationObserver(records=>{
   if(busy)return;busy=true;
   try{for(const r of records){
     if(r.type==='characterData')applyNode(r.target);
     else if(r.type==='attributes')applyNode(r.target);
     else for(const n of r.addedNodes)applyNode(n);
   }}finally{busy=false}
 });
 async function boot(){
   const selector=document.getElementById('interfaceLanguage');if(!selector)return;
   try{
     const res=await fetch(LOCALES+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('idiomas.json');
     const index=await res.json();const entries=index.languages||{};
     selector.replaceChildren();
     for(const [code,entry] of Object.entries(entries)){
       if(!entry||typeof entry.translations!=='object')continue;
       const option=document.createElement('option');option.value=code;option.textContent=entry.name||code;selector.append(option);
     }
     const codes=[...selector.options].map(x=>x.value);
     if(!codes.length)throw Error('No hay idiomas disponibles');
     function setLanguage(code){
       const entry=entries[code];if(!entry)return;
       dictionary=entry.translations||{};active=code;selector.value=code;
       document.documentElement.lang=code;localStorage.setItem('pulsar-ui-language',code);
       applyNode(document.body);
     }
     selector.addEventListener('change',()=>setLanguage(selector.value));
     const saved=localStorage.getItem('pulsar-ui-language');
     setLanguage(codes.includes(saved)?saved:(codes.includes(index.default)?index.default:codes[0]));
     observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:allowed});
   }catch(e){
     console.error('No se pudieron cargar los idiomas:',e);
     const error=document.createElement('div');
     error.style.cssText='color:#ffb4b4;font-size:12px;margin-top:6px';
     error.textContent='No se pudieron cargar los idiomas.';
     selector.insertAdjacentElement('afterend',error);
   }
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
